<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ninja War: xem trước server sau khi chạy bot</title>
<style>
:root{--bg0:#16181d;--bg1:#1d2027;--bg2:#252932;--bg3:#2f343f;--line:#343a46;--tx:#e6e8ec;--tx2:#a3a9b5;--tx3:#737a88;--acc:#5b7cfa;--ok:#2f9e60;--bad:#d9434e;--sec:#4a505c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg0);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;display:flex;flex-direction:column}
.note{background:#3a3112;color:#f3dc8b;font-size:13px;padding:6px 14px;border-bottom:1px solid #5a4b17}
.app{flex:1;min-height:0;display:grid;grid-template-columns:270px 1fr 230px}
aside,.roles{background:var(--bg1);overflow-y:auto;min-height:0}
.srv{padding:14px 14px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg1);z-index:2}
.srv h1{font-size:16px;margin:0 0 10px}
.srv label{display:block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--tx3);margin-bottom:4px}
select{width:100%;background:var(--bg3);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:inherit;font-size:13px}
.cat{font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--tx3);padding:16px 12px 4px;text-transform:uppercase}
.ch{display:flex;align-items:center;gap:6px;width:calc(100% - 16px);margin:1px 8px;padding:6px 8px;border:0;border-radius:6px;background:none;color:var(--tx2);font:inherit;text-align:left;cursor:pointer}
.ch:hover{background:var(--bg2);color:var(--tx)}
.ch.on{background:var(--bg3);color:#fff}
.ch .i{flex:none;width:16px;text-align:center;color:var(--tx3);font-weight:700}
.ch .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .lock{font-size:11px;color:var(--tx3)}
.ch.voice{cursor:default}
main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg2)}
.top{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line)}
.top .menu{display:none;background:var(--bg3);color:var(--tx);border:0;border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
.top b{font-size:15.5px}
.top span{color:var(--tx3);font-size:13px}
.msgs{flex:1;overflow-y:auto;padding:18px 16px}
.m{display:flex;gap:12px;margin-bottom:18px}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#f0803c,#c2362f);display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff}
.hd{font-weight:600}.hd i{font-style:normal;background:var(--acc);color:#fff;font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.hd small{color:var(--tx3);font-weight:400;margin-left:8px;font-size:12px}
.body{overflow-wrap:anywhere}
.body h3{font-size:20px;margin:4px 0 6px}
.body p{margin:2px 0}
.body blockquote{margin:6px 0;padding:2px 0 2px 10px;border-left:4px solid var(--sec);color:var(--tx)}
.body ul{margin:4px 0;padding-left:22px}
.body code{background:var(--bg0);border-radius:4px;padding:1px 5px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{border:0;border-radius:6px;padding:8px 14px;color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--acc)}.btn.success{background:var(--ok)}.btn.danger{background:var(--bad)}.btn.secondary{background:var(--sec)}
.empty{color:var(--tx3);text-align:center;margin-top:40px}
.bar{margin:0 16px 16px;padding:11px 14px;border-radius:8px;background:var(--bg3);color:var(--tx3);font-size:14px}
.bar.can{color:var(--tx2)}
.roles{padding:6px 0 20px;border-left:1px solid var(--line)}
.roles h2{font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--tx3);padding:14px 14px 6px;margin:0}
.role{display:flex;align-items:center;gap:8px;padding:4px 14px;font-size:13.5px}
.role i{flex:none;width:10px;height:10px;border-radius:50%}
.role small{color:var(--tx3);margin-left:auto;font-size:11px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#000;color:#fff;padding:9px 16px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.show{opacity:.92}
@media(max-width:1000px){.app{grid-template-columns:250px 1fr}.roles{display:none}}
@media(max-width:700px){.app{grid-template-columns:1fr}aside{display:none;position:fixed;inset:0;z-index:5}aside.open{display:block}.top .menu{display:block}}
</style>
</head>

  </aside>

uce** · **Screenshot/video**.", "buttons": []}]}, {"name": "❓-help", "kind": "text", "access": "members_chat", "slow": 10, "msgs": [{"text": "# ❓ HELP\nQuestions about gameplay, teams and features. Please search the channel before asking!", "buttons": []}]}]}, {"name": "💬 SHINOBI COMMUNITY", "lang": "en", "access": "members_chat", "channels": [{"name": "💬-global-chat", "kind": "text", "access": "members_chat", "slow": 5, "msgs": []}, {"name": "⚔️-team-builds", "kind": "text", "access": "members_chat", "slow": 0, "msgs": []}, {"name": "📸-show-off", "kind": "text", "access": "members_chat", "slow": 10, "msgs": []}, {"name": "🏆-arena-rankings", "kind": "text", "access": "members_chat", "slow": 0, "msgs": []}, {"name": "🏯-find-a-guild", "kind": "text", "access": "members_chat", "slow": 0, "msgs": []}, {"name": "🛒-trading", "kind": "text", "access": "members_chat", "slow": 30, "msgs": [{"text": "# 🛒 TRADING\n> ⚠️ Never pay strangers first. Staff are not responsible for trades between players.", "buttons": []}]}]}, {"name": "🔊 VOICE", "lang": "en", "access": "members_chat", "channels": [{"name": "🔊 Global Voice", "kind": "voice", "access": "members_chat", "slow": 0, "msgs": []}, {"name": "⚔️ Ranking Deadline", "kind": "voice", "access": "members_chat", "slow": 0, "msgs": []}]}, {"name": "🎫 TICKET ĐANG MỞ", "lang": null, "access": "staff", "channels": []}, {"name": "🎫 OPEN TICKETS", "lang": null, "access": "staff", "channels": []}, {"name": "🔒 HOKAGE · BAN QUẢN TRỊ", "lang": null, "access": "staff", "channels": [{"name": "💬-staff-chat", "kind": "text", "access": "staff", "slow": 0, "msgs": []}, {"name": "🧾-log-ticket", "kind": "text", "access": "staff", "slow": 0, "msgs": []}, {"name": "🚨-log-moderation", "kind": "text", "access": "staff", "slow": 0, "msgs": []}]}], "roles": [{"name": "👑 Hokage (Admin)", "color": "#FF2A2A", "hoist": true}, {"name": "🔧 Dev Shinobi", "color": "#9B59B6", "hoist": true}, {"name": "🛡️ Anbu (Moderator)", "color": "#3498DB", "hoist": true}, {"name": "💳 Hỗ Trợ Viên", "color": "#E91E63", "hoist": true}, {"name": "💎 Đại Gia Làng Lá (VIP)", "color": "#F1C40F", "hoist": true}, {"name": "🏆 Tam Nhẫn Bảng XH", "color": "#E67E22", "hoist": true}, {"name": "🧠 Quân Sư Nhẫn Giả", "color": "#1ABC9C", "hoist": true}, {"name": "🐍 Sannin", "color": "#F5B041", "hoist": false}, {"name": "🔥 Jonin", "color": "#AF7AC5", "hoist": false}, {"name": "⚔️ Chunin", "color": "#5DADE2", "hoist": false}, {"name": "🥋 Genin", "color": "#BDC3C7", "hoist": false}, {"name": "🥷 Nhẫn Giả (Member)", "color": "#2ECC71", "hoist": true}, {"name": "🥷 Shinobi (Member)", "color": "#2ECC71", "hoist": true}, {"name": "🇻🇳 Tiếng Việt", "color": "#95A5A6", "hoist": false}, {"name": "🇬🇧 English", "color": "#95A5A6", "hoist": false}, {"name": "🔔 Ping Giftcode", "color": "#95A5A6", "hoist": false}, {"name": "⏰ Ping Event", "color": "#95A5A6", "hoist": false}], "tickets": {"nap": {"lang": "vi", "text": "💳 **TICKET NẠP THẺ**\nVui lòng gửi: **tên nhân vật**, **server**, **gói nạp** và **ảnh biên lai** (nếu đã chuyển).\n> ⚠️ Chỉ chuyển khoản theo thông tin staff gửi **trong ticket này**. Không chuyển cho bất kỳ ai nhắn riêng.", "buttons": [{"emoji": "🔒", "label": "Đóng ticket", "style": "danger"}]}, "hotro": {"lang": "vi", "text": "🆘 **TICKET HỖ TRỢ**\nHãy mô tả vấn đề: **tên nhân vật**, **thiết bị** (Android/iOS), chuyện gì xảy ra và **ảnh/video** nếu có.\n> ⚠️ Staff không bao giờ hỏi mật khẩu hoặc mã OTP.", "buttons": [{"emoji": "🔒", "label": "Đóng ticket", "style": "danger"}]}, "topup": {"lang": "en", "text": "💳 **TOP-UP TICKET**\nPlease send: **character name**, **server**, **package** and **receipt** (if already paid).\n> ⚠️ Only pay using the details staff send **in this ticket**. Never pay anyone who DMs you.", "buttons": [{"emoji": "🔒", "label": "Close ticket", "style": "danger"}]}, "support": {"lang": "en", "text": "🆘 **SUPPORT TICKET**\nDescribe the problem: **character name**, **device** (Android/iOS), what happened, and a **screenshot/video** if you have one.\n> ⚠️ Staff will never ask for your password or OTP.", "buttons": [{"emoji": "🔒", "label": "Close ticket", "style": "danger"}]}}};
const WHO = [
  ["new","Người mới vào (chưa chọn ngôn ngữ)"],
  ["vi_lang","Đã chọn 🇻🇳 Tiếng Việt, chưa xác minh"],
  ["vi_member","🥷 Nhẫn Giả (tiếng Việt, đã xác minh)"],
  ["en_lang","Đã chọn 🇬🇧 English, chưa xác minh"],
  ["en_member","🥷 Shinobi (tiếng Anh, đã xác minh)"],
  ["support","💳 Hỗ Trợ Viên"],
  ["staff","👑 Hokage / Dev / Anbu"]];
const SAMPLE = {vi_member:["nap"], en_member:["topup"], support:["nap","topup"], staff:["nap","topup"]};
let who = "new", cur = null;
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isStaff = () => who === "staff" || who === "support";
function canSee(access, lang){
  if (access === "open" || isStaff()) return true;
  const [l, lvl] = who === "new" ? [null, null] : who.split("_");
  if (access === "info") return l === lang;
  if (access === "members_info" || access === "members_chat") return l === lang && lvl === "member";
  return false;
}
function canSend(access){
  if (who === "staff") return true;
  if (who === "support") return access === "members_chat" || access === "staff";
  return access === "members_chat";
}
function inline(s){
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/_\(([^)]*)\)_/g, "<em>($1)</em>");
}
function md(text){
  let out = "", list = false;
  for (const line of text.split("\n")){
    const li = line.startsWith("* ");
    if (list && !li){ out += "</ul>"; list = false; }
    if (line.startsWith("# ")) out += "<h3>" + inline(line.slice(2)) + "</h3>";
    else if (line.startsWith("> ")) out += "<blockquote>" + inline(line.slice(2)) + "</blockquote>";
    else if (li){ if (!list){ out += "<ul>"; list = true; } out += "<li>" + inline(line.slice(2)) + "</li>"; }
    else out += "<p>" + inline(line) + "</p>";
  }
  return out + (list ? "</ul>" : "");
}
function tree(){
  const cats = [];
  for (const c of DATA.cats){
    const chs = c.channels.filter(ch => canSee(ch.access, c.lang)).map(ch => ({...ch}));
    const isTicketCat = c.access === "staff" && !c.channels.length;
    if (isTicketCat){
      const want = c.name.includes("OPEN") ? "topup" : "nap";
      if ((SAMPLE[who] || []).includes(want)){
        const t = DATA.tickets[want];
        const mention = who.endsWith("member") ? "@Bạn" : "@NguoiChoi";
        chs.push({name: want + "-nguoichoi", kind:"text", access:"ticket", slow:0, sample:true,
                  msgs:[{text: mention + " @💳 Hỗ Trợ Viên\n" + t.text, buttons: t.buttons}]});
      }
    }
    if (chs.length || (isStaff() && canSee(c.access, c.lang))) cats.push({name: c.name, chs});
  }
  return cats;
}
function render(){
  const cats = tree(), flat = cats.flatMap(c => c.chs).filter(ch => ch.kind === "text");
  if (!flat.some(ch => ch.name === cur)) cur = flat[0] ? flat[0].name : null;
  const nav = $("nav"); nav.innerHTML = "";
  for (const c of cats){
    const h = document.createElement("div"); h.className = "cat"; h.textContent = c.name; nav.appendChild(h);
    if (!c.chs.length){ const e = document.createElement("div"); e.className = "ch voice"; e.innerHTML = '<span class="i"></span><span class="n" style="color:var(--tx3)">(trống, chờ ticket mới)</span>'; nav.appendChild(e); }
    for (const ch of c.chs){
      const b = document.createElement(ch.kind === "voice" ? "div" : "button");
      b.className = "ch" + (ch.kind === "voice" ? " voice" : "") + (ch.name === cur ? " on" : "");
      b.innerHTML = '<span class="i">' + (ch.kind === "voice" ? "🔊" : "#") + '</span><span class="n">' + esc(ch.name) + '</span>' + (ch.sample ? '<span class="lock">ví dụ</span>' : "");
      if (ch.kind !== "voice") b.onclick = () => { cur = ch.name; $("side").classList.remove("open"); render(); };
      nav.appendChild(b);
    }
  }
  const ch = flat.find(x => x.name === cur);
  $("title").textContent = ch ? "# " + ch.name : "";
  $("sub").textContent = ch && ch.slow ? "Chế độ chậm: " + ch.slow + " giây" : (ch && ch.sample ? "Phòng ticket ví dụ: chỉ người mở và staff nhìn thấy" : "");
  const box = $("msgs"); box.innerHTML = "";
  if (ch && ch.msgs.length){
    for (const m of ch.msgs){
      const d = document.createElement("div"); d.className = "m";
      d.innerHTML = '<div class="av">NW</div><div><div class="hd">Ninja War Bot<i>BOT</i><small>bài đăng sẵn</small></div><div class="body">' + md(m.text) + '</div>' +
        (m.buttons.length ? '<div class="btns">' + m.buttons.map(b => '<button class="btn ' + b.style + '">' + b.emoji + " " + esc(b.label) + '</button>').join("") + '</div>' : "") + '</div>';
      box.appendChild(d);
    }
  } else if (ch){
    const e = document.createElement("div"); e.className = "empty"; e.textContent = "Kênh trống. Bot không đăng bài sẵn ở đây, thành viên tự trò chuyện."; box.appendChild(e);
  }
  box.querySelectorAll(".btn").forEach(b => b.onclick = () => toast("Bản xem trước: nút này chỉ hoạt động trên Discord thật."));
  const bar = $("bar"), send = ch && (ch.access === "ticket" || canSend(ch.access));
  bar.className = "bar" + (send ? " can" : "");
  bar.textContent = !ch ? "" : send ? "Nhắn tin vào #" + ch.name : "🔒 Vai trò này chỉ được đọc, không gửi tin nhắn trong kênh này.";
  box.scrollTop = 0;
}
let tt; function toast(s){ const t = $("toast"); t.textContent = s; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 2200); }
const sel = $("who");
for (const [v, l] of WHO){ const o = document.createElement("option"); o.value = v; o.textContent = l; sel.appendChild(o); }
sel.onchange = () => { who = sel.value; render(); };
$("menu").onclick = () => $("side").classList.toggle("open");
$("roles").innerHTML = DATA.roles.map(r => '<div class="role"><i style="background:' + r.color + '"></i>' + esc(r.name) + (r.hoist ? "<small>hiện riêng</small>" : "") + '</div>').join("");
render();
</script>
